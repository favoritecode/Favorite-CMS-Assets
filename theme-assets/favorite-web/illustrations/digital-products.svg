<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="dig_blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="dig_cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <circle cx="200" cy="150" r="110" fill="#0EA5E9" fill-opacity="0.04"/>

  <!-- Centered Digital Product Box Card -->
  <g transform="translate(100, 50)">
    <!-- Main Software / File Window -->
    <rect x="15" y="25" width="170" height="150" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="15" y="25" width="170" height="30" rx="10" fill="#F8FAFC"/>
    <path d="M 15 55 L 185 55" stroke="#E2E8F0" stroke-width="1"/>
    <!-- Window controls -->
    <circle cx="32" cy="40" r="3.5" fill="#EF4444" fill-opacity="0.8"/>
    <circle cx="44" cy="40" r="3.5" fill="#F59E0B" fill-opacity="0.8"/>
    <circle cx="56" cy="40" r="3.5" fill="#10B981" fill-opacity="0.8"/>

    <!-- Central Package / Download Graphic -->
    <circle cx="100" cy="102" r="32" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.5"/>
    <!-- Download Arrow -->
    <path d="M 100 86 L 100 114" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
    <polyline points="91 106 100 115 109 106" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 86 122 L 114 122" stroke="#0EA5E9" stroke-width="2" stroke-linecap="round"/>

    <!-- License Verification Key Pill (Floating bottom right) -->
    <rect x="70" y="145" width="115" height="36" rx="18" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <circle cx="88" cy="163" r="7" fill="url(#dig_cyan)"/>
    <path d="M 104 163 L 165 163" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 3"/>

    <!-- Digital File Token (Floating top left) -->
    <g transform="translate(-15, 10)">
      <rect x="0" y="0" width="48" height="54" rx="6" fill="url(#dig_blue)"/>
      <polyline points="16 28 21 33 32 21" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>