<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="shop_blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="shop_amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <circle cx="200" cy="150" r="110" fill="#2563EB" fill-opacity="0.04"/>

  <g transform="translate(70, 45)">
    <!-- Storefront Catalog Card -->
    <rect x="30" y="30" width="200" height="150" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <!-- Store Header Bar -->
    <rect x="30" y="30" width="200" height="28" rx="10" fill="#F8FAFC"/>
    <line x1="30" y1="58" x2="230" y2="58" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="44" y="40" width="36" height="8" rx="2" fill="#2563EB"/>
    <rect x="88" y="40" width="24" height="8" rx="2" fill="#CBD5E1"/>

    <!-- Product Card Items in Grid -->
    <rect x="46" y="72" width="76" height="88" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="54" y="80" width="60" height="36" rx="4" fill="#E2E8F0"/>
    <rect x="54" y="124" width="40" height="6" rx="2" fill="#64748B"/>
    <rect x="54" y="136" width="24" height="8" rx="2" fill="url(#shop_blue)"/>

    <rect x="138" y="72" width="76" height="88" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="146" y="80" width="60" height="36" rx="4" fill="#E2E8F0"/>
    <rect x="146" y="124" width="40" height="6" rx="2" fill="#64748B"/>
    <rect x="146" y="136" width="24" height="8" rx="2" fill="url(#shop_blue)"/>

    <!-- Floating Shopping Cart & Success Badge -->
    <g transform="translate(170, 120)">
      <circle cx="34" cy="34" r="30" fill="url(#shop_amber)"/>
      <!-- Cart Icon White -->
      <path d="M 20 22 L 23 22 L 25.5 33 A 2 2 0 0 0 27.5 35 L 39 35 A 2 2 0 0 0 41 33 L 43 26 L 24 26" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="28" cy="41" r="1.5" fill="#FFFFFF"/>
      <circle cx="38" cy="41" r="1.5" fill="#FFFFFF"/>
    </g>

    <!-- Floating Secure Checkout Badge (Top Left) -->
    <g transform="translate(0, 10)">
      <rect x="0" y="0" width="56" height="32" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="16" r="5" fill="#10B981"/>
      <path d="M 14 16 L 15.5 17.5 L 18 14.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="28" y1="16" x2="44" y2="16" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>