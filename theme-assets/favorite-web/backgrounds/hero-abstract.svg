<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#0EA5E9" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.01"/>
    </linearGradient>
    <linearGradient id="line_grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.02"/>
      <stop offset="50%" stop-color="#0EA5E9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="aura" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#2563EB" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient light aura -->
  <rect width="1440" height="900" fill="url(#bg_grad1)"/>
  <circle cx="1150" cy="180" r="450" fill="url(#aura)"/>

  <!-- Subtle sweeping geometric contours -->
  <path d="M-100 250 C 300 150, 700 450, 1100 280 C 1300 200, 1450 240, 1600 200" fill="none" stroke="url(#line_grad1)" stroke-width="1.5"/>
  <path d="M-50 380 C 350 280, 750 580, 1150 410 C 1350 330, 1480 370, 1600 330" fill="none" stroke="url(#line_grad1)" stroke-width="1.5"/>
  <path d="M-100 520 C 300 420, 800 680, 1200 540 C 1380 470, 1500 500, 1600 480" fill="none" stroke="url(#line_grad1)" stroke-width="1.5"/>

  <!-- Subtle corner geometric grid marks -->
  <g stroke="#2563EB" stroke-opacity="0.12" stroke-width="1">
    <line x1="80" y1="80" x2="160" y2="80"/>
    <line x1="80" y1="80" x2="80" y2="160"/>
    <circle cx="80" cy="80" r="3" fill="#2563EB" fill-opacity="0.2"/>
    <line x1="1360" y1="820" x2="1280" y2="820"/>
    <line x1="1360" y1="820" x2="1360" y2="740"/>
    <circle cx="1360" cy="820" r="3" fill="#0EA5E9" fill-opacity="0.2"/>
  </g>
</svg>