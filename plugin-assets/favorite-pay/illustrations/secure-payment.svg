<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="sec_blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="sec_emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="sec_sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="card_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="sec_shadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Circles -->
  <circle cx="200" cy="150" r="115" fill="#10B981" fill-opacity="0.04"/>
  <circle cx="200" cy="150" r="85" fill="#2563EB" fill-opacity="0.04"/>

  <!-- Background Encrypted Network Rays -->
  <g stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3 4">
    <line x1="80" y1="80" x2="140" y2="120"/>
    <line x1="320" y1="80" x2="260" y2="120"/>
    <line x1="80" y1="220" x2="140" y2="180"/>
    <line x1="320" y1="220" x2="260" y2="180"/>
  </g>
  <circle cx="80" cy="80" r="4" fill="#0EA5E9" fill-opacity="0.6"/>
  <circle cx="320" cy="80" r="4" fill="#10B981" fill-opacity="0.6"/>
  <circle cx="80" cy="220" r="4" fill="#10B981" fill-opacity="0.6"/>
  <circle cx="320" cy="220" r="4" fill="#2563EB" fill-opacity="0.6"/>

  <!-- Background Payment Card (Floating Angled) -->
  <g transform="translate(100, 75)" filter="url(#sec_shadow)">
    <rect x="0" y="0" width="200" height="120" rx="12" fill="url(#card_grad)" stroke="#E2E8F0" stroke-width="1.5"/>
    <line x1="0" y1="28" x2="200" y2="28" stroke="#1E293B" stroke-width="16" stroke-opacity="0.08"/>
    <!-- Smart Chip -->
    <rect x="24" y="52" width="30" height="22" rx="4" fill="url(#sec_sky)"/>
    <rect x="28" y="56" width="22" height="14" rx="2" fill="#FFFFFF" fill-opacity="0.4"/>
    <!-- Card detail lines (abstract geometry, no fake numbers) -->
    <rect x="24" y="88" width="60" height="8" rx="2" fill="#CBD5E1"/>
    <rect x="92" y="88" width="36" height="8" rx="2" fill="#E2E8F0"/>
    <!-- Card Emblem Circles -->
    <circle cx="158" cy="88" r="10" fill="#2563EB" fill-opacity="0.2"/>
    <circle cx="170" cy="88" r="10" fill="#10B981" fill-opacity="0.25"/>
  </g>

  <!-- Central Shield of Security (Trust & Encryption Anchor) -->
  <g transform="translate(160, 110)" filter="url(#sec_shadow)">
    <!-- Outer Shield Border -->
    <path d="M40 0C68 0 80 14 80 32C80 66 40 92 40 92C40 92 0 66 0 32C0 14 12 0 40 0Z" fill="#FFFFFF"/>
    <!-- Inner Shield Gradient -->
    <path d="M40 4C64 4 75 16 75 32C75 62 40 86 40 86C40 86 5 62 5 32C5 16 16 4 40 4Z" fill="url(#sec_emerald)"/>
    <!-- Shield Highlight Flare -->
    <path d="M40 6C61 6 71 17 71 32C71 44 60 61 40 76C40 76 40 6 40 6Z" fill="#FFFFFF" fill-opacity="0.15"/>
    <!-- Verified Lock / Checkmark Symbol -->
    <path d="M28 44L36 52L52 34" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Verification Badge Accent -->
  <g transform="translate(244, 185)">
    <circle cx="16" cy="16" r="16" fill="url(#sec_blue)"/>
    <polyline points="11 16 14.5 19.5 21 13" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
