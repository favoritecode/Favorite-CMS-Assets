<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" fill="none">
  <!-- Background Canvas Card -->
  <rect width="400" height="300" rx="16" fill="#0F172A"/>
  <rect x="20" y="20" width="360" height="260" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>

  <!-- Screen Frame / Cinema Display -->
  <rect x="50" y="45" width="300" height="170" rx="8" fill="#0B0F19" stroke="#475569" stroke-width="2"/>

  <!-- Ambient Glow Behind Player -->
  <circle cx="200" cy="130" r="60" fill="#2563EB" fill-opacity="0.25"/>
  <circle cx="200" cy="130" r="30" fill="#0EA5E9" fill-opacity="0.3"/>

  <!-- Big Play Button Centerpiece -->
  <circle cx="200" cy="130" r="28" fill="#2563EB"/>
  <polygon points="193 118 213 130 193 142 193 118" fill="#FFFFFF"/>

  <!-- Video Scrub Bar & Scrubber -->
  <rect x="70" y="192" width="260" height="6" rx="3" fill="#334155"/>
  <rect x="70" y="192" width="160" height="6" rx="3" fill="#2563EB"/>
  <circle cx="230" cy="195" r="6" fill="#0EA5E9"/>

  <!-- Soundwave / Audio Waveform Graphic Left -->
  <rect x="70" y="70" width="4" height="24" rx="2" fill="#38BDF8" fill-opacity="0.7"/>
  <rect x="78" y="60" width="4" height="44" rx="2" fill="#38BDF8" fill-opacity="0.7"/>
  <rect x="86" y="75" width="4" height="14" rx="2" fill="#38BDF8" fill-opacity="0.7"/>
  <rect x="94" y="65" width="4" height="34" rx="2" fill="#38BDF8" fill-opacity="0.7"/>

  <!-- Premium VIP Unlocked Badge Right -->
  <rect x="270" y="60" width="65" height="24" rx="12" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1.5"/>
  <polygon points="284 66 286 71 291 71.5 287.5 75 288.5 80 284 77.5 279.5 80 280.5 75 277 71.5 282 71 284 66" fill="#10B981"/>
  <text x="296" y="76" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold" fill="#10B981">PRO</text>

  <!-- Bottom Media Control Icons Tray -->
  <circle cx="70" cy="245" r="14" fill="#334155"/>
  <polygon points="67 240 75 245 67 250 67 240" fill="#E2E8F0"/>

  <rect x="100" y="242" width="90" height="6" rx="3" fill="#334155"/>
  <rect x="100" y="242" width="50" height="6" rx="3" fill="#0EA5E9"/>

  <!-- Audio Tracks List Preview Right -->
  <circle cx="280" cy="245" r="4" fill="#10B981"/>
  <text x="292" y="249" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">Lossless Audio</text>

  <circle cx="200" cy="245" r="4" fill="#38BDF8"/>
  <text x="210" y="249" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">1080p HLS</text>
</svg>

