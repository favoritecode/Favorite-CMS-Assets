<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="del_blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="del_sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="del_emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="del_shadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.09"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Circles -->
  <circle cx="200" cy="150" r="110" fill="#0EA5E9" fill-opacity="0.04"/>
  <circle cx="200" cy="150" r="80" fill="#2563EB" fill-opacity="0.03"/>

  <!-- High-Speed Transmission Path / Data Rays -->
  <g stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4">
    <path d="M70 150C110 90 160 80 200 80C240 80 290 90 330 150"/>
    <path d="M70 150C110 210 160 220 200 220C240 220 290 210 330 150"/>
  </g>
  <circle cx="90" cy="115" r="4" fill="#0EA5E9" fill-opacity="0.6"/>
  <circle cx="310" cy="115" r="4" fill="#10B981" fill-opacity="0.6"/>
  <circle cx="90" cy="185" r="4" fill="#2563EB" fill-opacity="0.6"/>
  <circle cx="310" cy="185" r="4" fill="#0EA5E9" fill-opacity="0.6"/>

  <!-- Central Digital Delivery Package (Floating Isometric) -->
  <g transform="translate(130, 85)" filter="url(#del_shadow)">
    <!-- Package Box / Container -->
    <rect x="0" y="0" width="140" height="130" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="0" y="0" width="140" height="24" rx="12" fill="url(#del_blue)"/>
    <rect x="0" y="12" width="140" height="12" fill="url(#del_blue)"/>
    <!-- Fold seam -->
    <line x1="70" y1="24" x2="70" y2="130" stroke="#F1F5F9" stroke-width="2"/>

    <!-- Digital File Token inside Package -->
    <g transform="translate(30, 42)">
      <rect x="0" y="0" width="80" height="52" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
      <rect x="8" y="10" width="36" height="5" rx="2" fill="#94A3B8"/>
      <rect x="8" y="20" width="24" height="4" rx="2" fill="#CBD5E1"/>
      <!-- Download Arrow Emitting downward -->
      <circle cx="60" cy="26" r="14" fill="url(#del_sky)"/>
      <polyline points="54 26 60 32 66 26" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="60" y1="18" x2="60" y2="31" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Version Release Tag Badge -->
    <g transform="translate(16, 104)">
      <rect x="0" y="0" width="46" height="16" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="7" cy="8" r="3" fill="#0EA5E9"/>
      <rect x="14" y="6" width="24" height="4" rx="1" fill="#64748B"/>
    </g>

    <!-- Instant Fulfillment Success Seal -->
    <g transform="translate(118, 108)">
      <circle cx="12" cy="12" r="16" fill="url(#del_emerald)"/>
      <polyline points="7 12 10.5 15.5 17 9" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
