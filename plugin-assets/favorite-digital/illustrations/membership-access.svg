<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="mem_card_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="mem_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="mem_blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="mem_emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="mem_shadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Circles -->
  <circle cx="200" cy="150" r="115" fill="#2563EB" fill-opacity="0.04"/>
  <circle cx="200" cy="150" r="85" fill="#10B981" fill-opacity="0.04"/>

  <!-- Connecting Access Beams to Unlocked Category Packages -->
  <g stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3 4">
    <line x1="130" y1="130" x2="90" y2="190"/>
    <line x1="200" y1="130" x2="200" y2="190"/>
    <line x1="270" y1="130" x2="310" y2="190"/>
  </g>

  <!-- Floating VIP / Membership Access Card -->
  <g transform="translate(110, 40)" filter="url(#mem_shadow)">
    <rect x="0" y="0" width="180" height="105" rx="10" fill="url(#mem_card_grad)" stroke="#334155" stroke-width="1.5"/>
    <line x1="0" y1="26" x2="180" y2="26" stroke="#475569" stroke-width="1" stroke-opacity="0.4"/>
    <!-- Membership Tier Badge -->
    <rect x="16" y="42" width="46" height="16" rx="4" fill="url(#mem_blue)"/>
    <!-- Member Name Placeholder Bars -->
    <rect x="16" y="74" width="70" height="6" rx="2" fill="#94A3B8"/>
    <rect x="16" y="84" width="40" height="5" rx="2" fill="#64748B"/>
    <!-- Glowing Access Key / Star Seal -->
    <circle cx="146" cy="65" r="18" fill="url(#mem_emerald)" fill-opacity="0.2"/>
    <circle cx="146" cy="65" r="14" fill="url(#mem_emerald)"/>
    <polygon points="146,55 149,62 156,63 151,68 153,75 146,71 139,75 141,68 136,63 143,62" fill="#FFFFFF"/>
  </g>

  <!-- Unlocked Category Asset Packages (Row of 3 below) -->
  <!-- Package 1 -->
  <g transform="translate(60, 190)" filter="url(#mem_shadow)">
    <rect x="0" y="0" width="65" height="70" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="8" y="10" width="49" height="24" rx="4" fill="#F1F5F9"/>
    <circle cx="32" cy="22" r="6" fill="#0EA5E9"/>
    <circle cx="53" cy="10" r="9" fill="url(#mem_emerald)"/>
    <polyline points="49.5 10 52 12.5 56.5 8" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="8" y="44" width="36" height="5" rx="2" fill="#CBD5E1"/>
    <rect x="8" y="53" width="24" height="4" rx="2" fill="#E2E8F0"/>
  </g>

  <!-- Package 2 -->
  <g transform="translate(167, 190)" filter="url(#mem_shadow)">
    <rect x="0" y="0" width="65" height="70" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="8" y="10" width="49" height="24" rx="4" fill="#F1F5F9"/>
    <circle cx="32" cy="22" r="6" fill="#2563EB"/>
    <circle cx="53" cy="10" r="9" fill="url(#mem_emerald)"/>
    <polyline points="49.5 10 52 12.5 56.5 8" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="8" y="44" width="36" height="5" rx="2" fill="#CBD5E1"/>
    <rect x="8" y="53" width="24" height="4" rx="2" fill="#E2E8F0"/>
  </g>

  <!-- Package 3 -->
  <g transform="translate(275, 190)" filter="url(#mem_shadow)">
    <rect x="0" y="0" width="65" height="70" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="8" y="10" width="49" height="24" rx="4" fill="#F1F5F9"/>
    <circle cx="32" cy="22" r="6" fill="#8B5CF6"/>
    <circle cx="53" cy="10" r="9" fill="url(#mem_emerald)"/>
    <polyline points="49.5 10 52 12.5 56.5 8" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="8" y="44" width="36" height="5" rx="2" fill="#CBD5E1"/>
    <rect x="8" y="53" width="24" height="4" rx="2" fill="#E2E8F0"/>
  </g>
</svg>
