<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="inv_blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="inv_sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="inv_emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="box_wood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="inv_shadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Circles -->
  <circle cx="200" cy="150" r="110" fill="#2563EB" fill-opacity="0.03"/>
  <circle cx="200" cy="150" r="80" fill="#10B981" fill-opacity="0.04"/>

  <!-- Warehouse Storage Rack / Tier Shelves -->
  <g transform="translate(70, 50)" filter="url(#inv_shadow)">
    <!-- Vertical Frame Struts -->
    <rect x="0" y="0" width="8" height="195" rx="2" fill="#0F172A"/>
    <rect x="252" y="0" width="8" height="195" rx="2" fill="#0F172A"/>

    <!-- Horizontal Shelf Beams -->
    <!-- Top Shelf -->
    <rect x="0" y="85" width="260" height="8" rx="2" fill="#1E293B"/>
    <!-- Bottom Shelf -->
    <rect x="0" y="175" width="260" height="8" rx="2" fill="#1E293B"/>

    <!-- TOP SHELF PARCELS / CRATES -->
    <!-- Box 1 -->
    <g transform="translate(18, 20)">
      <rect x="0" y="0" width="65" height="65" rx="6" fill="url(#box_wood)" stroke="#E2E8F0" stroke-width="1.5"/>
      <line x1="32" y1="0" x2="32" y2="65" stroke="#CBD5E1" stroke-width="2"/>
      <rect x="8" y="14" width="28" height="6" rx="2" fill="url(#inv_blue)"/>
      <circle cx="50" cy="50" r="5" fill="#10B981"/>
    </g>

    <!-- Box 2 -->
    <g transform="translate(95, 12)">
      <rect x="0" y="0" width="72" height="73" rx="6" fill="url(#inv_sky)"/>
      <line x1="36" y1="0" x2="36" y2="73" stroke="#0284C7" stroke-width="2"/>
      <rect x="10" y="18" width="32" height="6" rx="2" fill="#FFFFFF" fill-opacity="0.6"/>
      <rect x="10" y="30" width="20" height="5" rx="2" fill="#FFFFFF" fill-opacity="0.4"/>
    </g>

    <!-- Box 3 -->
    <g transform="translate(180, 28)">
      <rect x="0" y="0" width="62" height="57" rx="6" fill="url(#box_wood)" stroke="#E2E8F0" stroke-width="1.5"/>
      <line x1="31" y1="0" x2="31" y2="57" stroke="#CBD5E1" stroke-width="2"/>
      <rect x="8" y="12" width="24" height="6" rx="2" fill="#94A3B8"/>
    </g>

    <!-- BOTTOM SHELF PARCELS -->
    <!-- Box 4 (Large master crate) -->
    <g transform="translate(18, 105)">
      <rect x="0" y="0" width="105" height="70" rx="6" fill="url(#inv_blue)"/>
      <line x1="52" y1="0" x2="52" y2="70" stroke="#1D4ED8" stroke-width="2"/>
      <rect x="12" y="18" width="40" height="8" rx="2" fill="#FFFFFF" fill-opacity="0.7"/>
      <rect x="12" y="32" width="26" height="6" rx="2" fill="#93C5FD"/>
      <!-- Barcode Accent Scan -->
      <line x1="68" y1="18" x2="94" y2="18" stroke="#38BDF8" stroke-width="2"/>
      <line x1="68" y1="24" x2="90" y2="24" stroke="#38BDF8" stroke-width="2"/>
    </g>

    <!-- Box 5 -->
    <g transform="translate(136, 110)">
      <rect x="0" y="0" width="105" height="65" rx="6" fill="url(#box_wood)" stroke="#E2E8F0" stroke-width="1.5"/>
      <line x1="52" y1="0" x2="52" y2="65" stroke="#CBD5E1" stroke-width="2"/>
      <rect x="12" y="16" width="30" height="6" rx="2" fill="#10B981"/>
      <rect x="12" y="28" width="20" height="5" rx="2" fill="#CBD5E1"/>
    </g>
  </g>

  <!-- Stock Status Tag Pill -->
  <g transform="translate(255, 35)" filter="url(#inv_shadow)">
    <rect x="0" y="0" width="85" height="26" rx="13" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="13" cy="13" r="6" fill="url(#inv_emerald)"/>
    <rect x="26" y="10" width="45" height="6" rx="2" fill="#64748B"/>
  </g>
</svg>
