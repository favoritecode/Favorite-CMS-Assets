<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="deliv_blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="deliv_sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="deliv_emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="deliv_shadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Circles -->
  <circle cx="200" cy="150" r="115" fill="#2563EB" fill-opacity="0.03"/>
  <circle cx="200" cy="150" r="85" fill="#0EA5E9" fill-opacity="0.04"/>

  <!-- Regional Route Trajectory & Delivery Speed Waves -->
  <g stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4">
    <path d="M50 190C110 190 140 120 220 120C280 120 310 170 350 170"/>
  </g>
  <line x1="50" y1="210" x2="130" y2="210" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
  <line x1="70" y1="218" x2="110" y2="218" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>

  <!-- Destination Zone Pin -->
  <g transform="translate(335, 140)">
    <circle cx="15" cy="15" r="14" fill="#0EA5E9" fill-opacity="0.15"/>
    <circle cx="15" cy="15" r="6" fill="#0EA5E9"/>
  </g>

  <!-- Delivery Courier Van / Transport Unit -->
  <g transform="translate(100, 105)" filter="url(#deliv_shadow)">
    <!-- Cargo Box -->
    <rect x="0" y="10" width="130" height="80" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <line x1="30" y1="10" x2="30" y2="90" stroke="#F1F5F9" stroke-width="2"/>
    <rect x="42" y="30" width="56" height="24" rx="4" fill="url(#deliv_blue)"/>
    <rect x="52" y="38" width="36" height="8" rx="2" fill="#FFFFFF" fill-opacity="0.6"/>

    <!-- Cab Unit -->
    <path d="M130 35H160C168 35 174 41 176 48L184 66C186 70 186 74 186 78V90H130V35Z" fill="url(#deliv_sky)"/>
    <!-- Windshield -->
    <path d="M136 42H156L166 64H136V42Z" fill="#FFFFFF" fill-opacity="0.75"/>

    <!-- Front & Rear Bumpers -->
    <rect x="-4" y="82" width="6" height="8" rx="2" fill="#94A3B8"/>
    <rect x="184" y="82" width="6" height="8" rx="2" fill="#94A3B8"/>

    <!-- Headlight -->
    <circle cx="182" cy="74" r="3" fill="#F59E0B"/>

    <!-- Wheels (with rims) -->
    <!-- Rear Wheel -->
    <g transform="translate(32, 90)">
      <circle cx="0" cy="0" r="16" fill="#0F172A"/>
      <circle cx="0" cy="0" r="7" fill="#CBD5E1"/>
    </g>
    <!-- Front Wheel -->
    <g transform="translate(150, 90)">
      <circle cx="0" cy="0" r="16" fill="#0F172A"/>
      <circle cx="0" cy="0" r="7" fill="#CBD5E1"/>
    </g>
  </g>

  <!-- Verified Delivery Status Badge -->
  <g transform="translate(260, 75)" filter="url(#deliv_shadow)">
    <circle cx="18" cy="18" r="18" fill="url(#deliv_emerald)"/>
    <polyline points="12 18 16 22 24 14" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
