name: Update Releases Index

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-index
  cancel-in-progress: false

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          fetch-depth: 0

      - name: Rebuild release index from GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from datetime import datetime, timezone

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "release-index-updater",
          }

          releases = []
          page = 1
          while True:
              url = f"https://api.github.com/repos/{repo}/releases?per_page=100&page={page}"
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  batch = json.load(response)
              if not batch:
                  break
              releases.extend(r for r in batch if not r.get("draft", False))
              if len(batch) < 100:
                  break
              page += 1

          groups = [
              "Favorite Pay",
              "Favorite Digital",
              "Favorite Shop",
              "Favorite Page Builder",
              "Favorite Courier & Fraud Checker",
              "Favorite Web Official",
              "Favorite Web Tools",
              "Favorite Multimedia",
              "Favorite Multimedia Theme",
              "Favorite QR Studio Pro",
              "Favorite Barcode Studio Pro",
              "Favorite Universal Code Scanner Pro",
              "Google Drive Custom Video Player",
              "Media Fetcher",
              "YouTube SEO Extractor",
              "Web Analyzer",
              "Other / Needs classification",
          ]

          rules = [
              ("Favorite Courier & Fraud Checker", ("courier-fraud-checker", "courier & fraud checker", "courier and fraud checker", "courier_fraud_checker")),
              ("Favorite Universal Code Scanner Pro", ("universal-code-scanner", "universal code scanner")),
              ("Favorite Barcode Studio Pro", ("barcode-studio-pro", "barcode studio pro")),
              ("Favorite QR Studio Pro", ("qr-studio-pro", "qr studio pro")),
              ("Google Drive Custom Video Player", ("google-drive-custom-video-player", "google drive custom video player")),
              ("YouTube SEO Extractor", ("youtube-seo-extractor", "youtube seo extractor")),
              ("Media Fetcher", ("media-fetcher", "media fetcher")),
              ("Favorite Multimedia Theme", ("favorite-multimedia-theme", "favorite multimedia theme")),
              ("Favorite Multimedia", ("favorite-multimedia", "favorite multimedia")),
              ("Favorite Page Builder", ("favorite-page-builder", "favorite page builder")),
              ("Favorite Web Official", ("favorite-web-official", "favorite web official", "favorite web theme")),
              ("Favorite Web Tools", ("favorite-web-tools", "favorite web tools")),
              ("Favorite Digital", ("favorite-digital", "favorite digital")),
              ("Favorite Pay", ("favorite-pay", "favorite pay")),
              ("Favorite Shop", ("favorite-shop", "favorite shop")),
              ("Web Analyzer", ("web-analyzer", "web analyzer")),
          ]

          def classify(release):
              title = (release.get("name") or "").lower()
              tag = (release.get("tag_name") or "").lower()
              assets = " ".join(a.get("name", "") for a in release.get("assets", [])).lower()
              text = f"{title} {tag} {assets}"
              for group, needles in rules:
                  if any(needle in text for needle in needles):
                      return group
              return "Other / Needs classification"

          def version_key(release):
              name = release.get("name") or ""
              tag = release.get("tag_name") or ""
              m = re.search(r'v?(\d+)\.(\d+)(?:\.(\d+))?(?:[.-](\d+))?', name)
              if not m:
                  m = re.search(r'v?(\d+)\.(\d+)(?:\.(\d+))?(?:[.-](\d+))?', tag)
              if m:
                  major = int(m.group(1))
                  minor = int(m.group(2))
                  patch = int(m.group(3)) if m.group(3) else 0
                  build = int(m.group(4)) if m.group(4) else 0
                  ver_tuple = (major, minor, patch, build)
              else:
                  ver_tuple = (-1, -1, -1, -1)
              pub = release.get("published_at") or release.get("created_at") or ""
              return (ver_tuple, pub)

          grouped = {group: [] for group in groups}
          for release in releases:
              grouped[classify(release)].append(release)

          for group in groups:
              grouped[group].sort(key=version_key, reverse=True)

          lines = [
              "# Favorite CMS Assets — Release Index",
              "",
              "This index groups published GitHub Releases by product so versions and downloadable packages are easier to find.",
              "",
              f"- **Repository:** [{repo}](https://github.com/{repo})",
              f"- **All releases:** [GitHub Releases page](https://github.com/{repo}/releases)",
              "- **Scope:** Index only. This file does not change, rename, or replace any release, tag, or binary asset.",
              "- **Legacy tags:** Existing tag names are preserved as published. Use the tag shown for each release.",
              "- **Maintenance:** Add each new release under the matching product heading when it is published.",
              "",
          ]

          for group in groups:
              entries = grouped[group]
              if not entries:
                  continue
              lines.extend([f"## {group}", ""])
              for release in entries:
                  name = release.get("name") or release.get("tag_name") or "Untitled release"
                  tag = release.get("tag_name") or ""
                  url = release.get("html_url") or f"https://github.com/{repo}/releases"
                  asset_names = [asset.get("name", "") for asset in release.get("assets", []) if asset.get("name")]
                  assets_text = ", ".join(f"`{a}`" for a in asset_names) or "no uploaded assets"
                  safe_name = name.replace("[", "\\[").replace("]", "\\]")
                  lines.append(f"- [{safe_name}]({url}) — tag: `{tag}` — assets: {assets_text}")
              lines.append("")

          lines.extend([
              "---",
              "",
              f"*Generated from the repository's published Releases API on {datetime.now(timezone.utc).strftime('%Y-%m-%d')} (all API pages retrieved).*",
              "",
          ])
          new_content = "\n".join(lines)

          path = "RELEASES-INDEX.md"
          try:
              with open(path, "r", encoding="utf-8") as file:
                  old_content = file.read()
          except FileNotFoundError:
              old_content = ""

          old_release_lines = [l for l in old_content.splitlines() if l.startswith("- [")]
          new_release_lines = [l for l in lines if l.startswith("- [")]

          if old_release_lines == new_release_lines and old_content:
              print("Release index entries are already up to date.")
              raise SystemExit(0)

          with open(path, "w", encoding="utf-8", newline="\n") as file:
              file.write(new_content)

          print("Successfully rebuilt RELEASES-INDEX.md.")
          if grouped["Other / Needs classification"]:
              print(f"::warning::{len(grouped['Other / Needs classification'])} release(s) could not be confidently classified; they are listed under Other / Needs classification.")
          PY

      - name: Commit updated index
        run: |
          if git diff --quiet -- RELEASES-INDEX.md; then
            echo "No release index changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RELEASES-INDEX.md
          git commit -m "docs: auto-update release index"
          git pull --rebase origin ${{ github.event.repository.default_branch || 'main' }}
          git push origin HEAD:${{ github.event.repository.default_branch || 'main' }}
