name: Favorite Shop checks
on:
  push:
    branches: ['feature/favorite-shop-v1.0.0']
    paths: ['plugins/favorite-shop/**', '.github/workflows/favorite-shop-lint.yml']
  pull_request:
    paths: ['plugins/favorite-shop/**']
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: favorite_shop_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      FAVORITE_SHOP_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=favorite_shop_test;charset=utf8mb4
      FAVORITE_SHOP_TEST_USER: root
      FAVORITE_SHOP_TEST_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax checks
        run: find plugins/favorite-shop -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: COD lifecycle tests
        run: php plugins/favorite-shop/tests/CodLifecycleTest.php
      - name: Product measurement and quantity tests
        run: php plugins/favorite-shop/tests/ProductMeasurementTest.php
      - name: Promotion, coupon and stock rules tests
        run: php plugins/favorite-shop/tests/PromotionStockTest.php
      - name: MySQL installer schema smoke test
        run: php plugins/favorite-shop/tests/InstallerSchemaTest.php
      - name: Theme layout integration checks
        run: php plugins/favorite-shop/tests/ThemeIntegrationTest.php
      - name: Product image upload regression checks
        run: php plugins/favorite-shop/tests/ProductImageUploadTest.php
      - name: Validate manifest
        run: php -r '$m=json_decode(file_get_contents("plugins/favorite-shop/plugin.json"), true, 512, JSON_THROW_ON_ERROR); if (($m["id"] ?? "") !== "favorite-shop") exit(1);'
      - name: Build preview ZIP
        if: github.event_name == 'push'
        run: |
          mkdir -p dist
          cd plugins
          zip -r ../dist/Favorite-Shop-v1.0.0-preview.zip favorite-shop -x 'favorite-shop/.git/*' 'favorite-shop/.github/*'
          cd ../dist
          sha256sum Favorite-Shop-v1.0.0-preview.zip > SHA256SUMS.txt
      - name: Upload ZIP artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Favorite-Shop-v1.0.0-preview
          path: dist/*
          if-no-files-found: error
