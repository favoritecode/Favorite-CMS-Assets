    <circle cx="90" cy="110" r="36" fill="url(#sup_blue)"/>
    <circle cx="90" cy="110" r="18" fill="#FFFFFF"/>
    <line x1="64" y1="84" x2="77" y2="97" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="116" y1="136" x2="103" y2="123" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="116" y1="84" x2="103" y2="97" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="64" y1="136" x2="77" y2="123" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

