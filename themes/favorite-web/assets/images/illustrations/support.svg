    <path d="M 90 20 L 160 50 V 105 C 160 150 125 185 90 200 C 55 185 20 150 20 105 V 50 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <path d="M 90 32 L 148 58 V 105 C 148 143 118 174 90 187 C 62 174 32 143 32 105 V 58 Z" fill="#F8FAFC"/>

