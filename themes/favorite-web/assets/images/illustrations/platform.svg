<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="plat_blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="plat_cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="card_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>

  <!-- Ambient Backdrop Circle -->
  <circle cx="200" cy="150" r="110" fill="#2563EB" fill-opacity="0.04"/>

  <!-- Base Platform Foundation (Isometric-style stacked layers) -->
  <g transform="translate(40, 20)">
    <!-- Base Layer (The CMS Core Engine) -->
    <rect x="60" y="190" width="200" height="40" rx="8" fill="url(#card_bg)" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="76" y="204" width="80" height="12" rx="3" fill="#CBD5E1"/>
    <circle cx="230" cy="210" r="5" fill="#10B981"/>
    <circle cx="244" cy="210" r="5" fill="#0EA5E9"/>

    <!-- Middle Layer (Extensible Module Bus) -->
    <rect x="40" y="130" width="240" height="44" rx="8" fill="url(#card_bg)" stroke="#CBD5E1" stroke-width="1.5"/>
    <!-- Connecting Data Pins -->
    <line x1="100" y1="174" x2="100" y2="190" stroke="#0EA5E9" stroke-width="2" stroke-dasharray="3 3"/>
    <line x1="160" y1="174" x2="160" y2="190" stroke="#2563EB" stroke-width="2"/>
    <line x1="220" y1="174" x2="220" y2="190" stroke="#0EA5E9" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Module blocks on middle layer -->
    <rect x="56" y="142" width="48" height="20" rx="4" fill="url(#plat_blue)"/>
    <rect x="116" y="142" width="48" height="20" rx="4" fill="url(#plat_cyan)"/>
    <rect x="176" y="142" width="48" height="20" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <rect x="236" y="142" width="32" height="20" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>

    <!-- Top Floating Hero Component (The Active Solution) -->
    <rect x="80" y="60" width="160" height="54" rx="8" fill="url(#card_bg)" stroke="#2563EB" stroke-width="2"/>
    <path d="M 100 80 L 124 80 M 100 92 L 140 92" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
    <!-- Brand Spark / Extension icon badge -->
    <circle cx="210" cy="87" r="14" fill="url(#plat_cyan)"/>
    <polyline points="205 87 209 91 216 83" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Dynamic Flow Connectors -->
    <line x1="160" y1="114" x2="160" y2="130" stroke="#2563EB" stroke-width="2"/>
  </g>
</svg>