<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%">
  <defs>
    <pattern id="grid_pattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#2563EB" stroke-width="1" stroke-opacity="0.08"/>
      <circle cx="60" cy="0" r="1.5" fill="#0EA5E9" fill-opacity="0.2"/>
    </pattern>
    <radialGradient id="fade_mask" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="65%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <mask id="grid_mask">
      <rect width="1440" height="900" fill="url(#fade_mask)"/>
    </mask>
  </defs>

  <rect width="1440" height="900" fill="url(#grid_pattern)" mask="url(#grid_mask)"/>
</svg>